<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WatchTogether</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body><main class="app">
<header><div><div class="brand">WatchTogether</div><div class="muted">Watch local videos together</div></div><div id="status" class="status">Ready</div></header>
<section class="hero">
<div class="card"><h1>එකට Video බලමු 🎬</h1><p>Host local video එක WebRTC හරහා Guest වෙත stream වෙනවා.</p>
<div class="actions"><label class="btn primary">🎬 Video Select<input id="videoInput" type="file" accept="video/*" hidden></label><button id="createBtn" class="btn">🔗 Create Room</button><button id="copyBtn" class="btn" disabled>📋 Copy Link</button></div>
<div class="roombox"><input id="roomLink" readonly placeholder="Room link"><button id="joinBtn" class="btn">👤 Join</button></div>
<div id="fileName" class="muted">No video selected</div></div>
<div class="card video-card"><div class="video-title"><b>Video</b><span id="role">Not connected</span></div><video id="video" controls playsinline></video></div>
</section>
<section class="grid"><div class="card"><h2>👥 Online</h2><div id="users">0 users</div></div>
<div class="card"><h2>💬 Chat</h2><div id="messages" class="messages"></div><div class="chatrow"><input id="chatInput" placeholder="Message..."><button id="sendBtn" class="btn">Send</button></div></div></section>
<footer><span>Firebase = room/sync only</span><span>WebRTC = actual video</span></footer>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
