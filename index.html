<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WatchTogether</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="brand">WatchTogether</div>
        <div class="muted">Local video + Firebase sync + PeerJS</div>
      </div>
      <div id="status" class="status">Ready</div>
    </header>

    <section class="hero">
      <div class="card">
        <h1>එකට video බලමු 🎬</h1>
        <p>Host කෙනාගේ local video file එක browser එකෙන්ම select කරලා room එක share කරන්න.</p>
        <div class="actions">
          <label class="btn primary">
            🎬 Video Select
            <input id="videoInput" type="file" accept="video/*" hidden>
          </label>
          <button id="createBtn" class="btn">🔗 Create Room</button>
          <button id="copyBtn" class="btn" disabled>📋 Copy Link</button>
        </div>
        <div class="roombox">
          <input id="roomLink" readonly placeholder="Room link මෙතැන පෙන්වයි">
          <button id="joinBtn" class="btn">👤 Join</button>
        </div>
      </div>

      <div class="card video-card">
        <video id="video" controls playsinline></video>
        <div class="video-info">
          <span id="fileName">No video selected</span>
          <span id="role">Not connected</span>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>👥 Online</h2>
        <div id="users">0 users</div>
      </div>
      <div class="card">
        <h2>💬 Chat</h2>
        <div id="messages" class="messages"></div>
        <div class="chatrow">
          <input id="chatInput" placeholder="Message...">
          <button id="sendBtn" class="btn">Send</button>
        </div>
      </div>
    </section>

    <footer>
      <span>Firebase = room/sync state only</span>
      <span>WebRTC = video transport</span>
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
